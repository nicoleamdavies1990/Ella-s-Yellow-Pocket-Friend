<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Pal">
<meta name="theme-color" content="#2b2b3a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pocket Pal</title>
<style>
  /* Layout: one egg-shaped handheld centred on a dark desk. Single look by design, so the toy reads the same in any theme. */
  :root{
    --bg:#2b2b3a; --fg:#9a9ab0; --shell:#f4d35e; --bezel:#3a3a3a; --lcd:#c5d3a5; --link:#7aa2ff;
    --key:#17171a; --key-edge:#000; --key-shine:#4a4a52;
    color-scheme:dark;
  }
  *{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--fg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    box-sizing:border-box;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;
  }
  .shell{background:var(--shell);border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;padding:54px 26px 46px;
         box-shadow:inset 0 -10px 0 rgba(0,0,0,.12),0 12px 30px rgba(0,0,0,.45);
         display:flex;flex-direction:column;align-items:center;gap:16px;width:min(440px,94vw);box-sizing:border-box}
  .bezel{background:var(--bezel);padding:12px;border-radius:12px;width:100%;box-sizing:border-box;box-shadow:inset 0 2px 6px #000}
  canvas{width:100%;display:block;image-rendering:pixelated;background:var(--lcd);border-radius:4px;transition:filter .8s}
  canvas.dim{filter:brightness(.55)}
  /* three equal columns, so each button sits exactly under its icon on the screen */
  .btns{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;width:100%;box-sizing:border-box;padding:0 12px}
  .btns button{width:46px;height:46px;border-radius:50%;border:0;padding:0;
        background:radial-gradient(circle at 35% 30%,var(--key-shine),var(--key) 60%);
        box-shadow:0 4px 0 var(--key-edge),0 6px 8px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--key-edge)}
  .btns button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .dev{font-size:12px;text-align:center;line-height:1.8}
  .dev a{color:var(--link);margin:0 8px;cursor:pointer;text-decoration:underline}
  .dev[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">
  <div class="bezel"><canvas id="s"></canvas></div>
  <div class="btns">
    <button id="bFood" aria-label="Food"></button>
    <button id="bBath" aria-label="Bath"></button>
    <button id="bBed"  aria-label="Bed"></button>
  </div>
</div>
<div class="dev" hidden>
  <div id="stats"></div>
  <a id="skip">+1 hour</a><a id="skip4">+4 hours</a><a id="mute">sound: on</a><a id="reset">reset</a>
</div>

<script>
/* ---------- CONFIG: tune these ---------- */
const CFG = {
  hungerPerHour: 25,   // 4h from full to the floor
  cleanPerHour: 15,
  energyPerHour: 12,
  floor: 15,           // needs never drop below this: creature never "suffers"
  needThreshold: 45,   // below this the creature shows a gentle "I'd like..." icon
  eatBoost: 60,
  sleepMs: 8000,       // prototype nap length
  maxOfflineHours: 24
};

/* ---------- display ---------- */
const W = 128, H = 76;   // 64 rows of play area + a 12-row icon strip
const cv = document.getElementById('s'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const INK = '#2d3a1f', PAPER = '#c5d3a5';
const rect = (x,y,w,h)=>g.fillRect(Math.round(x),Math.round(y),w,h);
const px = (x,y)=>rect(x,y,1,1);
function bmp(x,y,rows){ x=Math.round(x); y=Math.round(y);
  rows.forEach((r,j)=>{ for(let i=0;i<r.length;i++) if(r[i]==='#') px(x+i,y+j); }); }
const ICON = {
  apple:["...#...","..##.#.",".#####.","#######","#######",".#####.","..#.#.."],
  drop:["...#...","...#...","..###..",".#####.","#######","#######",".#####."],
  moon:["..###..",".##....","##.....","##.....","##.....",".##..#.","..###.."],
  heart:[".#.#.","#####","#####",".###.","..#.."],
  ring:[".###.","#...#","#...#","#...#",".###."],
  z:["#####","...#.","..#..",".#...","#####"]
};

/* ---------- state ---------- */
const KEY = 'pocketpal-v1';
function decay(s, ms, sleeping){
  const h = Math.min(ms/3.6e6, CFG.maxOfflineHours);
  s.hunger = Math.max(CFG.floor, s.hunger - h*CFG.hungerPerHour);
  s.clean  = Math.max(CFG.floor, s.clean  - h*CFG.cleanPerHour);
  if(!sleeping) s.energy = Math.max(CFG.floor, s.energy - h*CFG.energyPerHour);
  return s;
}
function fresh(){ return {hunger:85,clean:85,energy:85,last:Date.now()}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s.last==='number') return decay(s, Date.now()-s.last, false);
  }catch(e){}
  return fresh();
}
function save(){ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ---------- sound ---------- */
let AC=null, muted=false;
function beep(f,d,when){
  if(muted || !f) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), v=AC.createGain();
    o.type='square'; o.frequency.value=f; o.connect(v); v.connect(AC.destination);
    const t=AC.currentTime+when;
    v.gain.setValueAtTime(.04,t); v.gain.linearRampToValueAtTime(0,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
function tune(notes){ let t=0; notes.forEach(([f,d])=>{ beep(f,d,t); t+=d; }); }
const SND = {
  eat:  ()=>tune([[523,.1],[0,.05],[523,.1],[0,.05],[659,.15]]),
  bath: ()=>tune([[784,.08],[988,.08],[1175,.08],[988,.08],[1319,.12]]),
  sleep:()=>tune([[523,.25],[440,.25],[349,.4]]),
  joy:  ()=>tune([[523,.08],[659,.08],[784,.08],[1047,.18]]),
  wake: ()=>tune([[440,.1],[587,.15]])
};

/* ---------- creature ---------- */
function ellipse(cx,cy,rx,ry){
  for(let dy=-ry; dy<=ry; dy++){
    const half = Math.round(rx*Math.sqrt(1-(dy/ry)**2));
    rect(cx-half, cy+dy, half*2+1, 1);
  }
}
function creature(cx, cy, eyes, mouth){
  const rx=17, ry=13;
  g.fillStyle = INK;
  ellipse(cx, cy, rx, ry);
  for(const ex of [cx-10, cx+10]){          // ears
    for(let r=0; r<8; r++){ const hw=Math.floor(r/2); rect(ex-hw, cy-ry-5+r, hw*2+1, 1); }
  }
  rect(cx-10, cy+ry, 6, 2); rect(cx+4, cy+ry, 6, 2);   // feet
  g.fillStyle = PAPER;
  const lx=cx-8, rx2=cx+5, ey=cy-4;
  if(eyes==='open'){ rect(lx,ey,3,4); rect(rx2,ey,3,4); }
  else if(eyes==='blink'){ rect(lx,ey+2,3,1); rect(rx2,ey+2,3,1); }
  else if(eyes==='closed'){ rect(lx,ey+1,3,1); rect(rx2,ey+1,3,1); px(lx-1,ey); px(lx+3,ey); px(rx2-1,ey); px(rx2+3,ey); }
  else if(eyes==='happy'){ for(const x of [lx,rx2]){ px(x,ey+2); px(x+1,ey+1); px(x+2,ey+2); } }
  if(mouth==='smile'){ px(cx-4,cy+3); px(cx+4,cy+3); rect(cx-3,cy+4,7,1); }
  else if(mouth==='open'){ rect(cx-3,cy+3,7,4); }
  else if(mouth==='flat'){ rect(cx-2,cy+4,5,1); }
  rect(cx-13,cy+1,2,2); rect(cx+12,cy+1,2,2);          // cheeks
  g.fillStyle = INK;
}

/* ---------- modes ---------- */
let mode='idle', modeStart=0, x=0, tx=0, nextWander=0, blinkUntil=0, nextBlink=1500, lastSec=0;
const DUR = {eat:2600, bath:3200, sleep:CFG.sleepMs, joy:1800};
function setMode(m){ mode=m; modeStart=performance.now(); cv.classList.toggle('dim', m==='sleep'); }
function wakeFromSleep(early){
  const frac = Math.min(1,(performance.now()-modeStart)/CFG.sleepMs);
  S.energy = Math.min(100, S.energy + (100-S.energy)*(early?frac:1));
  save();
}
function act(kind){
  if(mode==='sleep'){ wakeFromSleep(true); SND.wake(); setMode('idle'); return; }  // any press wakes her
  if(kind==='eat'){ S.hunger=Math.min(100,S.hunger+CFG.eatBoost); SND.eat(); }
  if(kind==='bath'){ S.clean=100; SND.bath(); }
  if(kind==='sleep'){ SND.sleep(); }
  save(); setMode(kind);
}
function finish(){
  if(mode==='sleep'){ wakeFromSleep(false); SND.wake(); }
  if(mode==='eat'||mode==='bath'||mode==='sleep'){ SND.joy(); setMode('joy'); }
  else setMode('idle');
}
function lowest(){
  const n=[['apple',S.hunger],['drop',S.clean],['moon',S.energy]].sort((a,b)=>a[1]-b[1])[0];
  return n[1] < CFG.needThreshold ? n[0] : null;
}

/* ---------- main loop ---------- */
function frame(now){
  const dt = now - modeStart;
  if(DUR[mode] && dt > DUR[mode]) finish();

  if(now - lastSec > 1000){            // slow-moving needs decay while open
    decay(S, now-lastSec>5000?1000:now-lastSec, mode==='sleep'); lastSec=now; save(); updateStats();
  }

  g.fillStyle = PAPER; g.fillRect(0,0,W,H); g.fillStyle = INK;
  const need = lowest();
  const bob = need ? (Math.floor(now/220)%2)*2 : Math.floor(now/450)%2;
  const cx = 64 + Math.round(x), baseY = 40;

  if(mode==='idle'){
    if(now>nextWander){ tx = Math.random()<.4 ? x : Math.round((Math.random()*2-1)*20); nextWander = now+1500+Math.random()*2500; }
    x += Math.sign(tx-x)*Math.min(.25,Math.abs(tx-x));
    if(now>nextBlink){ blinkUntil=now+160; nextBlink=now+2000+Math.random()*3000; }
    creature(cx, baseY+bob, now<blinkUntil?'blink':'open', 'smile');
  }
  else if(mode==='eat'){
    const chew = Math.floor(dt/200)%2;
    creature(cx, baseY, 'open', chew?'open':'smile');
    if(dt<1300) bmp(cx+20, baseY-2+chew, ICON.apple);
    else if(dt<1900) rect(cx+22, baseY+1, 3, 3);   // the core
  }
  else if(mode==='bath'){
    const wig = Math.floor(dt/160)%2 ? 1 : -1;
    creature(cx+wig, baseY, 'happy', 'smile');
    for(let i=0;i<6;i++){
      const by = baseY+16 - ((dt/35 + i*14)%46);
      bmp(cx-26+i*10 + (i%2?2:0), by, ICON.ring);
    }
  }
  else if(mode==='sleep'){
    creature(cx, baseY+2, 'closed', 'flat');
    const zb = Math.floor(dt/700)%2;
    bmp(cx+18, baseY-22-zb, ICON.z);
    if(dt>1200) bmp(cx+25, baseY-30-zb, ICON.z);
  }
  else if(mode==='joy'){
    creature(cx, baseY+bob, 'happy', 'smile');
    for(let i=0;i<3;i++){
      const hy = baseY-20 - ((dt/45 + i*7)%22);
      bmp(cx-16+i*13, hy, ICON.heart);
    }
  }
  /* corner gauges: food, bath, sleep, in the same order as the buttons.
     They never read empty, because needs bottom out at the floor. */
  [S.hunger,S.clean,S.energy].forEach((v,i)=>{
    const gx = W-15+i*5, gy = 3;
    g.fillStyle = INK; rect(gx,gy,3,12);
    g.fillStyle = PAPER; rect(gx+1,gy+1,1,10);
    g.fillStyle = INK;
    const h = Math.max(1,Math.round(10*v/100));
    rect(gx+1,gy+11-h,1,h);
  });

  /* bottom strip: each icon sits over the button that does it.
     It lights up while that action runs, and blinks when that need is low. */
  g.fillStyle = INK; rect(0,63,W,1);
  const blink = Math.floor(now/500)%2===0;
  [['apple',21,'eat'],['drop',64,'bath'],['moon',107,'sleep']].forEach(([ic,c,m])=>{
    const on = mode===m || (mode==='idle' && need===ic && blink);
    if(on){ g.fillStyle = INK; rect(c-6,65,13,11); g.fillStyle = PAPER; }
    else g.fillStyle = INK;
    bmp(c-3,67,ICON[ic]);
  });
  g.fillStyle = INK;
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const $ = id=>document.getElementById(id);
function updateStats(){
  $('stats').textContent = `food ${Math.round(S.hunger)} · clean ${Math.round(S.clean)} · energy ${Math.round(S.energy)}`;
}
[['bFood','eat'],['bBath','bath'],['bBed','sleep']].forEach(([id,k])=>{
  $(id).addEventListener('pointerdown', e=>{ e.preventDefault(); act(k); });
});
$('skip').onclick  = ()=>{ decay(S,3.6e6,false); save(); updateStats(); };
$('skip4').onclick = ()=>{ decay(S,4*3.6e6,false); save(); updateStats(); };
$('mute').onclick  = e=>{ muted=!muted; e.target.textContent = 'sound: '+(muted?'off':'on'); };
$('reset').onclick = ()=>{ S=fresh(); save(); updateStats(); setMode('idle'); };
/* dev tools only show when the link ends in #dev */
function checkDev(){ $('stats').parentElement.hidden = location.hash !== '#dev'; }
checkDev(); window.addEventListener('hashchange', checkDev);
document.addEventListener('contextmenu', e=>e.preventDefault());
/* iOS only unlocks audio on click/touchend, so prime it there */
function unlockAudio(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
}
['touchend','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
updateStats(); setMode('idle'); requestAnimationFrame(t=>{ lastSec=t; frame(t); });
</script>
</body>
</html>
