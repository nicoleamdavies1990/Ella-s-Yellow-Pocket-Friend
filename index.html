<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Pocket Friend</title>
<meta name="theme-color" content="#f4d35e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Friend">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f4d35e; --bezel:#3a3a3a; --lcd:#c5d3a5;
    --key:#17171a; --key-edge:#000; --key-shine:#4a4a52;
    --cw:320px; --ch:190px; --bs:72px;   /* canvas width/height and button size, set by fit() below */
  }
  *{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;margin:0}
  body{
    height:100dvh;overflow:hidden;overscroll-behavior:none;
    background:var(--bg);
    display:grid;place-items:center;
    font-family:system-ui,sans-serif;touch-action:manipulation;
  }
  .device{display:flex;flex-direction:column;align-items:center;gap:14px}
  .bezel{background:var(--bezel);padding:6px;border-radius:12px;box-shadow:inset 0 2px 6px #000}
  canvas{display:block;width:var(--cw);height:var(--ch);image-rendering:pixelated;
         background:var(--lcd);border-radius:4px;transition:filter .8s}
  canvas.dim{filter:brightness(.55)}
  /* four equal columns the same width as the screen, so each button sits under its icon */
  .btns{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;width:var(--cw)}
  .btns button{width:var(--bs);height:var(--bs);border-radius:50%;border:0;padding:0;
        background:radial-gradient(circle at 35% 30%,var(--key-shine),var(--key) 60%);
        box-shadow:0 5px 0 var(--key-edge),0 7px 10px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
  .btns button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--key-edge)}
  .dev{position:fixed;left:0;right:0;bottom:4px;font-size:12px;text-align:center;line-height:1.8;color:#5a4a00}
  .dev a{color:#1a3fa0;margin:0 8px;cursor:pointer;text-decoration:underline}
  .dev[hidden]{display:none}
</style>
</head>
<body>

<main class="device">
  <div class="bezel"><canvas id="s"></canvas></div>
  <div class="btns">
    <button id="bFood" aria-label="Food"></button>
    <button id="bBath" aria-label="Bath"></button>
    <button id="bBrush" aria-label="Brush teeth"></button>
    <button id="bBed"  aria-label="Bed"></button>
  </div>
</main>
<div class="dev" hidden>
  <div id="stats"></div>
  <a id="skip">+1 hour</a><a id="skip4">+4 hours</a><a id="mute">sound: on</a><a id="reset">reset</a>
</div>

<script>
/* ---------- CONFIG: tune these ---------- */
const CFG = {
  hungerPerHour: 25,   // 4h from full to the floor
  cleanPerHour: 15,
  energyPerHour: 12,
  floor: 15,           // needs never drop below this: creature never "suffers"
  needThreshold: 45,   // below this the creature shows a gentle "I'd like..." icon
  eatBoost: 60,
  sleepMs: 8000,       // prototype nap length
  maxOfflineHours: 24,
  brushMs: 120000,     // tooth-brushing time: 2 minutes of actual brushing, which only counts while she taps
                       // (the link ending in #dev makes it 10 seconds for testing)
  tapCreditMs: 2500,   // each tap keeps the pet brushing for this long
  tapCapMs: 5000,      // taps can't be saved up beyond this, so mashing can't finish the brushing early
  brushQuitMs: 30000   // no taps for this long: the pet quietly puts the brush away
};

/* ---------- display ---------- */
const W = 128, H = 76;   // 64 rows of play area + a 12-row icon strip
const cv = document.getElementById('s'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const INK = '#2d3a1f', PAPER = '#c5d3a5';
const rect = (x,y,w,h)=>g.fillRect(Math.round(x),Math.round(y),w,h);
const px = (x,y)=>rect(x,y,1,1);
function bmp(x,y,rows){ x=Math.round(x); y=Math.round(y);
  rows.forEach((r,j)=>{ for(let i=0;i<r.length;i++) if(r[i]==='#') px(x+i,y+j); }); }
const SPR = {"creature_idle":["................................","................................","..###......................###..","..######................######..","...###..##............##..###...","....#.....#..........#.....#....",".....#.....##########.....#.....","......#..................#......",".......#................#.......","........#..............#........","..###....#............#.........","..#..#...#.##......##.#.........","..#...#.#..##......##..#........","..#....##......##......#........","..##....#.##........##.#........","....#...#.##...##...##.#........","...###..#....##..##....#........","...#.....#............#.........","....#...##............##........","...###..#..............#........","...#....#..............#........","....#..##..#..#..#..#..##.......","....#..#...#..#..#..#...#.......",".....#.#...#..#..#..#...#.......",".....###....##....##....#.......","......##................#.......","........##............###.......","........#.#.########.#.#........",".........###........###.........","................................","................................","................................"],"creature_blink":["................................","................................","..###......................###..","..######................######..","...###..##............##..###...","....#.....#..........#.....#....",".....#.....##########.....#.....","......#..................#......",".......#................#.......","........#..............#........","..###....#............#.........","..#..#...#............#.........","..#...#.#.###......###.#........","..#....##......##......#........","..##....#.##........##.#........","....#...#.##...##...##.#........","...###..#....##..##....#........","...#.....#............#.........","....#...##............##........","...###..#..............#........","...#....#..............#........","....#..##..#..#..#..#..##.......","....#..#...#..#..#..#...#.......",".....#.#...#..#..#..#...#.......",".....###....##....##....#.......","......##................#.......","........##............###.......","........#.#.########.#.#........",".........###........###.........","................................","................................","................................"],"creature_open":["................................","................................","..###......................###..","..######................######..","...###..##............##..###...","....#.....#..........#.....#....",".....#.....##########.....#.....","......#..................#......",".......#................#.......","........#..............#........","..###....#............#.........","..#..#...#.##......##.#.........","..#...#.#..##......##..#........","..#....##......##......#........","..##....#.##........##.#........","....#...#.##...##...##.#........","...###..#.....#..#.....#........","...#.....#....#..#....#.........","....#...##.....##.....##........","...###..#..............#........","...#....#..............#........","....#..##..#..#..#..#..##.......","....#..#...#..#..#..#...#.......",".....#.#...#..#..#..#...#.......",".....###....##....##....#.......","......##................#.......","........##............###.......","........#.#.########.#.#........",".........###........###.........","................................","................................","................................"],"creature_happy":["................................","................................","..###......................###..","..######................######..","...###..##............##..###...","....#.....#..........#.....#....",".....#.....#........#.....#.....","......#.....########.....#......",".......#................#.......","........#..............#........","..###....#..#......#..#.........","..#..#...#.#.#....#.#.#.........","..#...#.#..#.#....#.#..#........","..#....##......##......#........","..##....#.##........##.#........","....#...#.##...##...##.#........","...###..#....##..##....#........","...#.....#....#..#....#.........","....#...##.....##.....##........","...###..#..............#........","...#....#..#..#..#..#..#........","....#..##..#..#..#..#..##.......","....#..#...#..#..#..#...#.......",".....#.#....##....##....#.......",".....###................#.......","......##................#.......","........##............##........","........#.#.########.#.#........",".........###........###.........","................................","................................","................................"],"creature_sleep":["................................","................................","..###......................###..","..######................######..","...###..##............##..###...","....#.....#..........#.....#....",".....#.....##########.....#.....","......#..................#......",".......#................#.......","........#..............#........","..###....#.#.#....#.#.#.........","..#..#...#.#.#....#.#.#.........","..#...#.#...#......#...#........","..#....##......##......#........","..##....#.##........##.#........","....#...#.##...##...##.#........","...###..#....##..##....#........","...#.....#............#.........","....#...##............##........","...###..#..............#........","...#....#..............#........","....#..##..#..#..#..#..##.......","....#..#...#..#..#..#...#.......",".....#.#...#..#..#..#...#.......",".....###....##....##....#.......","......##................#.......","........##............###.......","........#.#.########.#.#........",".........###........###.........","................................","................................","................................"]};   // creature frames
const ICON = {"apple":["....#..","..##...",".#..#..","#....#.","#....#.",".#...#.","..###.."],"drop":["...#...","...#...","..#.#..",".#...#.",".#...#.",".#...#.","..###.."],"moon":["..####.",".##....","##.....","##.....","##.....",".##..#.","..###.."],"heart":[".#.#.","#####","#####",".###.","..#.."],"ring":[".###.","#...#","#...#","#...#",".###."],"z":[".###.","...#.","..#..",".#...",".###."],"core":["...#.","..#..",".###.","..#..",".###."]};   // icons and effects
/* extra sprites for tooth-brushing */
ICON.tooth    = [".##.##.","#..#..#","#.....#","#.....#",".#...#.",".#.#.#.",".##.##."];   // small icon for the button strip
ICON.brushBig = ["#.#.#.#........","###############","#######....####"];                    // the brush the pet holds: bristles, head, neck, handle
ICON.foam     = [".#.","#.#",".#."];
ICON.star     = ["..#..","..#..","#####","..#..","..#.."];

/* ---------- fit the screen to the phone ----------
   Works out the biggest screen that fits, using whole-number pixel scaling so the
   pixel art stays crisp. Runs again whenever the phone is folded or unfolded. */
function fit(){
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  const P = 12, B = 6, G = 14;                          // outer padding, bezel, gap
  const R = Math.min(110, Math.max(56, vh*0.2));        // room kept for the buttons
  const availW = vw - 2*P - 2*B;
  const availH = vh - 2*P - 2*B - G - R;
  const maxW = Math.max(W/dpr, Math.min(availW, availH*W/H));
  const k = Math.max(1, Math.floor(maxW*dpr/W));        // whole-number scale
  const cw = W*k/dpr, ch = H*k/dpr;
  const r = document.documentElement.style;
  r.setProperty('--cw', cw+'px');
  r.setProperty('--ch', ch+'px');
  r.setProperty('--bs', Math.max(44, Math.min(R, cw/4-8))+'px');
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
fit();

/* ---------- state ---------- */
const KEY = 'pocketpal-v1';
function decay(s, ms, sleeping){
  const h = Math.min(ms/3.6e6, CFG.maxOfflineHours);
  s.hunger = Math.max(CFG.floor, s.hunger - h*CFG.hungerPerHour);
  s.clean  = Math.max(CFG.floor, s.clean  - h*CFG.cleanPerHour);
  if(!sleeping) s.energy = Math.max(CFG.floor, s.energy - h*CFG.energyPerHour);
  return s;
}
function fresh(){ return {hunger:85,clean:85,energy:85,last:Date.now()}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s.last==='number') return decay(s, Date.now()-s.last, false);
  }catch(e){}
  return fresh();
}
function save(){ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ---------- sound ---------- */
let AC=null, muted=false;
function beep(f,d,when){
  if(muted || !f) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), v=AC.createGain();
    o.type='square'; o.frequency.value=f; o.connect(v); v.connect(AC.destination);
    const t=AC.currentTime+when;
    v.gain.setValueAtTime(.04,t); v.gain.linearRampToValueAtTime(0,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
function tune(notes){ let t=0; notes.forEach(([f,d])=>{ beep(f,d,t); t+=d; }); }
const SND = {
  eat:  ()=>tune([[523,.1],[0,.05],[523,.1],[0,.05],[659,.15]]),
  bath: ()=>tune([[784,.08],[988,.08],[1175,.08],[988,.08],[1319,.12]]),
  sleep:()=>tune([[523,.25],[440,.25],[349,.4]]),
  joy:  ()=>tune([[523,.08],[659,.08],[784,.08],[1047,.18]]),
  wake: ()=>tune([[440,.1],[587,.15]]),
  brush:()=>tune([[659,.08],[784,.08],[659,.08],[784,.12]]),
  tick: ()=>tune([[988,.06],[0,.05],[988,.06]]),          // a chime every 30 seconds: time to move to the next part of the mouth
  scrub:()=>beep(330+Math.random()*80, .04, 0),            // a tiny scritch for every tap
  shine:()=>tune([[784,.1],[988,.1],[1175,.1],[1568,.3]])
};

/* ---------- creature ---------- */
function creature(cx, cy, eyes, mouth){
  let k = 'creature_idle';
  if(eyes==='blink') k='creature_blink';
  else if(eyes==='happy') k='creature_happy';
  else if(eyes==='closed') k='creature_sleep';
  else if(mouth==='open') k='creature_open';
  g.fillStyle = INK;
  bmp(cx-16, cy-14, SPR[k]);
}

/* ---------- modes ---------- */
let mode='idle', modeStart=0, x=0, tx=0, nextWander=0, blinkUntil=0, nextBlink=1500, lastTick=Date.now();
const DUR = {eat:2600, bath:3200, sleep:CFG.sleepMs, joy:1800, shine:2800};
const brushMs = ()=> location.hash==='#dev' ? 10000 : CFG.brushMs;
/* lastQ: which quarter of the brushing we're in; wake: keeps the screen on;
   bprog: milliseconds of brushing done so far; credit: brushing time her taps have bought;
   lastTap/tapFx: when she last tapped; lastF: time of the previous frame */
let lastQ = 0, wake = null, bprog = 0, credit = 0, lastTap = 0, tapFx = -1e9, lastF = 0;
async function keepAwake(on){
  try{
    if(on){
      if('wakeLock' in navigator && !wake){
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', ()=>{ wake=null; });
      }
    } else if(wake){ await wake.release(); wake=null; }
  }catch(e){}
}
function setMode(m){ mode=m; modeStart=performance.now(); lastQ=0; bprog=0; credit=0; keepAwake(m==='brush'); cv.classList.toggle('dim', m==='sleep'); }
function wakeFromSleep(early){
  const frac = Math.min(1,(performance.now()-modeStart)/CFG.sleepMs);
  S.energy = Math.min(100, S.energy + (100-S.energy)*(early?frac:1));
  save();
}
function act(kind){
  if(mode==='sleep'){ wakeFromSleep(true); SND.wake(); setMode('idle'); return; }  // any press wakes her
  if(mode==='shine') return;      // let the sparkly ending play out, even if she is still tapping
  /* while brushing, each press of the brush button is one more scrub that keeps the pet going.
     The other buttons are ignored, so mashing around the screen can't break it. */
  if(mode==='brush'){
    if(kind==='brush'){ credit = Math.min(CFG.tapCapMs, credit + CFG.tapCreditMs); lastTap = tapFx = performance.now(); SND.scrub(); }
    return;
  }
  if(kind==='eat'){ S.hunger=Math.min(100,S.hunger+CFG.eatBoost); SND.eat(); }
  if(kind==='bath'){ S.clean=100; SND.bath(); }
  if(kind==='sleep'){ SND.sleep(); }
  if(kind==='brush'){ SND.brush(); save(); setMode('brush'); credit = CFG.tapCreditMs; lastTap = tapFx = performance.now(); return; }
  save(); setMode(kind);
}
function finish(){
  if(mode==='brush'){ SND.shine(); setMode('shine'); return; }   // full two minutes done: sparkly teeth
  if(mode==='sleep'){ wakeFromSleep(false); SND.wake(); }
  if(mode==='eat'||mode==='bath'||mode==='sleep'){ SND.joy(); setMode('joy'); }
  else setMode('idle');
}
function lowest(){
  const n=[['apple',S.hunger],['drop',S.clean],['moon',S.energy]].sort((a,b)=>a[1]-b[1])[0];
  return n[1] < CFG.needThreshold ? n[0] : null;
}

/* ---------- main loop ---------- */
function frame(now){
  const dt = now - modeStart;
  const fdt = Math.min(100, now - lastF); lastF = now;      // time since the last frame (capped so a sleeping screen can't jump the timer)
  if(mode==='brush'){
    /* brushing only moves forward while she keeps tapping: each tap buys the pet a little brushing time */
    if(credit > 0){ const use = Math.min(credit, fdt); credit -= use; bprog += use; }
    if(bprog >= brushMs()) finish();
    else if(now - lastTap > CFG.brushQuitMs) setMode('idle');   // she wandered off: put the brush away, no fuss
  }
  else if(DUR[mode] && dt > DUR[mode]) finish();

  /* Needs decay using the real clock, so time spent with the screen off or the app
     in the background still counts when the pet comes back on screen. */
  const wall = Date.now();
  if(wall - lastTick >= 1000){
    decay(S, wall - lastTick, mode==='sleep'); lastTick = wall; save(); updateStats();
  }

  g.fillStyle = PAPER; g.fillRect(0,0,W,H); g.fillStyle = INK;
  const need = lowest();
  const bob = need ? (Math.floor(now/220)%2)*2 : Math.floor(now/450)%2;
  const cx = 64 + Math.round(x), baseY = 40;

  if(mode==='idle'){
    if(now>nextWander){ tx = Math.random()<.4 ? x : Math.round((Math.random()*2-1)*18); nextWander = now+1500+Math.random()*2500; }
    x += Math.sign(tx-x)*Math.min(.25,Math.abs(tx-x));
    if(now>nextBlink){ blinkUntil=now+160; nextBlink=now+2000+Math.random()*3000; }
    creature(cx, baseY+bob, now<blinkUntil?'blink':'open', 'smile');
  }
  else if(mode==='eat'){
    const chew = Math.floor(dt/200)%2;
    creature(cx, baseY, 'open', chew?'open':'smile');
    if(dt<1300) bmp(cx+20, baseY-2+chew, ICON.apple);
    else if(dt<1900) bmp(cx+22, baseY+1, ICON.core);   // the core
  }
  else if(mode==='bath'){
    const wig = Math.floor(dt/160)%2 ? 1 : -1;
    creature(cx+wig, baseY, 'happy', 'smile');
    for(let i=0;i<6;i++){
      const by = baseY+16 - ((dt/35 + i*14)%46);
      bmp(cx-26+i*10 + (i%2?2:0), by, ICON.ring);
    }
  }
  else if(mode==='sleep'){
    creature(cx, baseY+2, 'closed', 'flat');
    const zb = Math.floor(dt/700)%2;
    bmp(cx+18, baseY-22-zb, ICON.z);
    if(dt>1200) bmp(cx+25, baseY-30-zb, ICON.z);
  }
  else if(mode==='joy'){
    creature(cx, baseY+bob, 'happy', 'smile');
    for(let i=0;i<3;i++){
      const hy = baseY-20 - ((dt/45 + i*7)%22);
      bmp(cx-16+i*13, hy, ICON.heart);
    }
  }
  else if(mode==='brush'){
    const active = credit > 0;
    const sway = Math.round(Math.sin(bprog/110)*3);       // brush wiggles while she taps, and holds still when she stops
    if(active) creature(cx, baseY, 'open', 'open');
    else creature(cx, baseY + (Math.floor(now/220)%2)*2, 'idle', 'smile');   // waiting: bounces gently to say "keep tapping!"
    const bx = cx-4+sway;
    g.fillStyle = PAPER; rect(bx-1, 41, 17, 5);           // clear a gap so the brush reads clearly
    g.fillStyle = INK;   bmp(bx, 42, ICON.brushBig);
    [[cx-10,46],[cx+8,47],[cx-4,50]].forEach(([fx,fy],i)=>{      // foam bubbles pop in and out
      if(active && ((Math.floor(bprog/200)+i)%3!==0 || now-tapFx<150)) bmp(fx, fy, ICON.foam);   // a burst of foam on every tap
    });
    /* progress bar across the top, with a mark every 30 seconds */
    const frac = Math.min(1, bprog/brushMs());
    const bx0=4, by0=4, bw=96;
    g.fillStyle = INK;   rect(bx0, by0, bw, 5);
    g.fillStyle = PAPER; rect(bx0+1, by0+1, bw-2, 3);
    g.fillStyle = INK;   rect(bx0+1, by0+1, Math.round((bw-2)*frac), 3);
    for(let i=1;i<4;i++){
      g.fillStyle = (frac*(bw-2) > i*bw/4) ? PAPER : INK;
      rect(bx0+Math.round(i*bw/4), by0+1, 1, 3);
    }
    g.fillStyle = INK;
    const q = Math.floor(frac*4);
    if(q>lastQ && q<4){ lastQ=q; SND.tick(); }
  }
  else if(mode==='shine'){
    creature(cx, baseY+bob, 'happy', 'smile');
    [[-26,30],[22,28],[-16,18],[14,16]].forEach(([dx,dy],i)=>{      // twinkling stars
      if((Math.floor(dt/220)+i)%2===0) bmp(cx+dx, dy, ICON.star);
    });
  }
  /* corner gauges: food, bath, sleep (brushing has no gauge: it's just a nice thing to do).
     They never read empty, because needs bottom out at the floor. */
  [S.hunger,S.clean,S.energy].forEach((v,i)=>{
    const gx = W-15+i*5, gy = 3;
    g.fillStyle = INK; rect(gx,gy,3,12);
    g.fillStyle = PAPER; rect(gx+1,gy+1,1,10);
    g.fillStyle = INK;
    const h = Math.max(1,Math.round(10*v/100));
    rect(gx+1,gy+11-h,1,h);
  });

  /* bottom strip: each icon sits over the button that does it.
     It lights up while that action runs, and blinks when that need is low. */
  g.fillStyle = INK; rect(0,63,W,1);
  const blink = Math.floor(now/500)%2===0;
  [['apple',16,'eat'],['drop',48,'bath'],['tooth',80,'brush'],['moon',112,'sleep']].forEach(([ic,c,m])=>{
    /* the tooth button lights up while she's brushing, and flashes when the pet is waiting for more taps */
    const on = (mode===m && !(m==='brush' && credit<=0 && !blink)) || (mode==='idle' && need===ic && blink);
    if(on){ g.fillStyle = INK; rect(c-6,65,13,11); g.fillStyle = PAPER; }
    else g.fillStyle = INK;
    bmp(c-3,67,ICON[ic]);
  });
  g.fillStyle = INK;
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const $ = id=>document.getElementById(id);
function updateStats(){
  $('stats').textContent = `food ${Math.round(S.hunger)} · clean ${Math.round(S.clean)} · energy ${Math.round(S.energy)}`;
}
[['bFood','eat'],['bBath','bath'],['bBrush','brush'],['bBed','sleep']].forEach(([id,k])=>{
  $(id).addEventListener('pointerdown', e=>{ e.preventDefault(); act(k); });
});
$('skip').onclick  = ()=>{ decay(S,3.6e6,false); save(); updateStats(); };
$('skip4').onclick = ()=>{ decay(S,4*3.6e6,false); save(); updateStats(); };
$('mute').onclick  = e=>{ muted=!muted; e.target.textContent = 'sound: '+(muted?'off':'on'); };
$('reset').onclick = ()=>{ S=fresh(); save(); updateStats(); setMode('idle'); };
/* dev tools only show when the link ends in #dev */
function checkDev(){ $('stats').parentElement.hidden = location.hash !== '#dev'; }
checkDev(); window.addEventListener('hashchange', checkDev);
document.addEventListener('contextmenu', e=>e.preventDefault());
/* browsers only allow sound after a touch, so wake the audio up on the first one */
function unlockAudio(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
/* save when the app is put away */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); else if(mode==='brush') keepAwake(true); });

/* offline support: lets the app open with no wifi */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

updateStats(); setMode('idle'); requestAnimationFrame(frame);
</script>

</body>
</html>
